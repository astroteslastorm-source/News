<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Daily news updates on technology, markets, and world events." />
  <title>News Update</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <span class="brand-mark">N</span>
        <span class="brand-name">News Update</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="#latest" class="nav-link">Latest</a>
        <a href="#tech" class="nav-link">Tech</a>
        <a href="#markets" class="nav-link">Markets</a>
        <a href="#world" class="nav-link">World</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span aria-hidden="true">◑</span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero container">
      <p class="eyebrow">Today &middot; <span id="today-date"></span></p>
      <h1 class="hero-title">Stay current. Stay informed.</h1>
      <p class="hero-lede">
        Concise, reliable updates on the stories that matter — refreshed throughout the day.
      </p>
    </section>

    <section id="latest" class="container">
      <div class="section-head">
        <h2>Latest stories</h2>
        <p class="muted">Loading the freshest headlines…</p>
      </div>
      <div id="news-grid" class="news-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> News Update. All rights reserved.</p>
      <p class="muted">Built as a static site scaffold.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
